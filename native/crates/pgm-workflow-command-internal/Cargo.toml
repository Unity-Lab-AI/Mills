[package]
name = "pgm-workflow-command-internal"
description = "PGM_WorkflowCommand_Internal (PsyGraphMediaWorkflowCommandInternal): the one `/hyperwork <name> [options] <prompt>` command-line parser for every product (the VibeRoller page, Hyper Prod Man, Jcode PGM) and the nearest-names helper for a name that matches nothing; serde only, no engine, no runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
