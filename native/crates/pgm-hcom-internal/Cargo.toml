[package]
name = "pgm-hcom-internal"
description = "PGM_HCom_Internal (PsyGraphMediaHumanCommunicationInternal): everything people-to-people: end-to-end encrypted chat, servers / channels / groups with roles and permissions, moderation, calls, attachments, voice clips, the Files library, profiles"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
pgm-core-internal = { path = "../pgm-core-internal" }
pgm-identity-internal = { path = "../pgm-identity-internal" }
pgm-net-internal = { path = "../pgm-net-internal" }
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
tokio = { version = "1.54.0", features = ["full"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
hex = "0.4.3"
p256 = { version = "0.13.2", features = ["ecdh", "jwk", "pkcs8"] }
rand_core = { version = "0.6", features = ["getrandom"] }
scrypt = { version = "0.11", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
