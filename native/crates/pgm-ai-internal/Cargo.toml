[package]
name = "pgm-ai-internal"
description = "PGM_AI_Internal (PsyGraphMediaAIInternal): everything AI: AI hosts that lend their AI (registry, jobs, sharing, engines, usage + caps), providers and inference APIs, Work runs, MCP tool relays, the assistant's tools (time, calculator, web), the host runner"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
pgm-core-internal = { path = "../pgm-core-internal" }
pgm-net-internal = { path = "../pgm-net-internal" }
pgm-identity-internal = { path = "../pgm-identity-internal" }
pgm-dist-internal = { path = "../pgm-dist-internal" }
pgm-collab-internal = { path = "../pgm-collab-internal" }
pgm-platform-internal = { path = "../pgm-platform-internal" }
base64 = "0.23.1"
futures-util = "0.3.34"
http-body-util = "0.1.5"
libc = "0.2.191"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
hex = "0.4.3"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server-auto"] }
regex = "1"
reqwest = { version = "0.13.3", default-features = false, features = ["rustls-no-provider", "json", "stream", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
subtle = "2.6.1"
tokio = { version = "1.54.0", features = ["full"] }
