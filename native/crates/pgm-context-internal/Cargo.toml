[package]
name = "pgm-context-internal"
description = "PGM_Context_Internal (PsyGraphMediaContextInternal): fewer tokens and more cache hits for every model provider: token counting per provider, the usage / cache ledger, cache-friendly prompt assembly (stable prefix, breakpoints, a volatile-text lint), tool-output shaping with a reversible stash, a repository symbol map (repomap), an exact / semantic response replay cache (replay) and prefix-cache backend routing (route)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
hex = "0.4.3"
regex = "1.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.10.9"
tiktoken-rs = "0.12"
tree-sitter = { version = "0.25", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-python = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.23", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }

[features]
tree-sitter = ["dep:tree-sitter", "dep:tree-sitter-rust", "dep:tree-sitter-python", "dep:tree-sitter-javascript", "dep:tree-sitter-typescript"]
