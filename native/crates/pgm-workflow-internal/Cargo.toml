[package]
name = "pgm-workflow-internal"
description = "PGM_Workflow_Internal (PsyGraphMediaWorkflowInternal): Hyper Workflows as data: the graph model and its JSON document (unknown fields kept, migrate on read), port types, validation, diff, versions, laws and prompts shapes, node-kind manifests and registry, template / condition expressions, the document store"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
pgm-core-internal = { path = "../pgm-core-internal" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
