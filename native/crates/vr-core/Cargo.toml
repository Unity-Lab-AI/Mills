[package]
name = "vr-core"
description = "VibeRoller's shared core: hub API client, AI host protocol, end-to-end encryption, settings, signed updates"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
aes-gcm = "0.10.3"
base64 = "0.23.1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
futures-util = "0.3.34"
hex = "0.4.3"
hkdf = "0.12.4"
hmac = "0.12.1"
p256 = { version = "0.13.2", features = ["ecdh", "jwk"] }
rand = "0.9.5"
reqwest = { version = "0.13.3", default-features = false, features = ["rustls-no-provider", "json", "stream", "http2"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "fs", "io-util", "process", "sync"] }
