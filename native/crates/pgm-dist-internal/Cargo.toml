[package]
name = "pgm-dist-internal"
description = "PGM_Dist_Internal (PsyGraphMediaDistributionInternal): shipping programs: Ed25519-signed release manifests, self-update (verify, swap in, self-test, roll back), a zip writer for packages, version stamps"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
pgm-core-internal = { path = "../pgm-core-internal" }
pgm-net-internal = { path = "../pgm-net-internal" }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
hex = "0.4.3"
p256 = { version = "0.13.2", features = ["ecdh", "jwk"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
