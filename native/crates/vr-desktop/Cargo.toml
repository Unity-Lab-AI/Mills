[package]
name = "vr-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
bytes = "1.12.1"
futures-util = "0.3.34"
http-body-util = "0.1.5"
hyper = { version = "1", features = ["server", "http1", "client"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server-auto"] }
portable-pty = "0.9.0"
reqwest = { version = "0.13.3", default-features = false, features = ["rustls-no-provider", "json", "stream", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tauri = { version = "2.11.6", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-notification = "2.4.0"
tauri-plugin-single-instance = "2.4.5"
tokio = { version = "1.54.0", features = ["full"] }
vr-core = { version = "0.1.0", path = "../vr-core" }

[build-dependencies]
tauri-build = "2.6.3"
