[package]
name = "pgm-net-internal"
description = "PGM_Net_Internal (PsyGraphMediaNetworkInternal): low-latency networking and syncing: the HTTP server kit (answers, CORS, hardening, a reverse proxy), long polls, HTTP clients, the encrypted host link (hello, session key, jobs, heartbeat)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
pgm-core-internal = { path = "../pgm-core-internal" }
bytes = "1.12.1"
ed25519-dalek = "2"
hex = "0.4.3"
http-body-util = "0.1.5"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server-auto", "client-legacy", "http1"] }
reqwest = { version = "0.13.3", default-features = false, features = ["rustls-no-provider", "json", "stream", "http2"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10.9"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.54.0", features = ["full"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
