# VibeRoller native: the Rust side of VibeRoller (board T-124 onwards). One Cargo workspace for everything that runs on a
# machine: the shared vr-core library (hub API client, AI host protocol, end-to-end encryption, settings, signed
# updates), and later the AI host (vr-host), the desktop app (Tauri) and the hub. The JavaScript hub and host stay the
# reference until the regression suite (bridge/test/regress.js) passes against the Rust ones (LAWS.md: forwards and
# backwards compatible; Windows and Linux always).
#
# Build:   cargo build --release                                  (Linux, this machine's target)
#          cargo build --release --target x86_64-pc-windows-gnu   (Windows, cross-compiled with mingw-w64: board T-123)
# Test:    cargo test
[workspace]
resolver = "2"
# the PGM libraries (PsyGraphMedia*Internal, reusable in any project: crates/NAMES.md) and the VibeRoller programs on them
members = ["crates/pgm-core-internal", "crates/pgm-platform-internal", "crates/pgm-net-internal", "crates/pgm-identity-internal", "crates/pgm-collab-internal", "crates/pgm-dist-internal", "crates/pgm-hcom-internal", "crates/pgm-context-internal", "crates/pgm-plan-internal", "crates/pgm-ai-internal", "crates/pgm-sandbox-internal", "crates/vr-core", "crates/vr-desktop", "crates/vr-host", "crates/vr-hub", "crates/vr-run", "crates/pgm-orchestrator-internal", "crates/pgm-workflow-internal", "crates/pgm-workflow-command-internal", "crates/pgm-workflow-engine-internal"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false
rust-version = "1.88"

[workspace.dependencies]
vr-core = { path = "crates/vr-core" }
pgm-core-internal = { path = "crates/pgm-core-internal" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
# unwind, not abort: one request's panic is that request's alone (answered 500, logged); the hub, its other
# connections and its locks (every lock recovers from a poisoning) go on. Before 5.4.0 any panic killed the whole hub.
panic = "unwind"
