<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mills</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #2a2f3a; --text: #e6e8ee; --muted: #8b93a7;
    --accent: #7c9cff; --me: #23304f; --bad: #ff6b6b; --good: #4fd18b;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
  button, input, textarea { font: inherit; color: inherit; }
  button { background: var(--accent); color: #0b0d12; border: 0; border-radius: 8px; padding: .55rem 1rem; font-weight: 600; cursor: pointer; }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  button:disabled { opacity: .5; cursor: default; }
  input, textarea { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: .6rem .75rem; width: 100%; }
  [hidden] { display: none !important; }

  .center { margin: auto; width: min(400px, 92vw); display: flex; flex-direction: column; gap: .75rem; }
  .center h1 { margin: 0 0 .25rem; font-size: 1.8rem; }
  .center p { margin: 0; color: var(--muted); font-size: .9rem; line-height: 1.4; }
  .err { color: var(--bad); font-size: .9rem; min-height: 1.2em; }
  .status { font-size: .8rem; color: var(--muted); }
  .status.on { color: var(--good); }

  #shell { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  header { display: flex; align-items: center; gap: .75rem; padding: .6rem 1rem; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header b { font-size: 1.1rem; }
  header .folder { color: var(--muted); font-size: .85rem; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #app { flex: 1; display: grid; grid-template-columns: 240px 1fr 1fr; min-height: 0; }
  #app > section { min-height: 0; display: flex; flex-direction: column; border-right: 1px solid var(--line); }
  .bar { display: flex; gap: .4rem; align-items: center; padding: .5rem; border-bottom: 1px solid var(--line); font-size: .85rem; color: var(--muted); }
  .bar span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar button { padding: .3rem .6rem; font-size: .8rem; }

  #tree { overflow: auto; flex: 1; padding: .25rem 0; font-size: .9rem; }
  #tree div { padding: .25rem .75rem; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #tree div:hover { background: var(--panel); }
  #editor { flex: 1; border: 0; border-radius: 0; resize: none; font-family: ui-monospace, Consolas, monospace; font-size: .85rem; line-height: 1.45; tab-size: 2; }

  #log { flex: 1; overflow: auto; padding: 1rem; display: flex; flex-direction: column; gap: .6rem; }
  .msg { padding: .6rem .8rem; border-radius: 10px; background: var(--panel); white-space: pre-wrap; word-wrap: break-word; line-height: 1.45; }
  .msg.me { background: var(--me); align-self: flex-end; max-width: 85%; }
  .msg pre { background: #0b0d12; padding: .6rem; border-radius: 6px; overflow-x: auto; white-space: pre; }
  .tool { font-size: .8rem; color: var(--muted); font-family: ui-monospace, Consolas, monospace; padding: .2rem .5rem; border-left: 2px solid var(--accent); word-break: break-all; }
  .sys { font-size: .8rem; color: var(--muted); text-align: center; }
  .sys.bad { color: var(--bad); }
  #composer { display: flex; gap: .5rem; padding: .75rem; border-top: 1px solid var(--line); }
  #composer textarea { resize: none; height: 4.2rem; }

  #archive { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; z-index: 10; }
  #archive .box { margin: auto; width: min(560px, 94vw); max-height: 80vh; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; display: flex; flex-direction: column; }
  #archive .box > .bar { padding: .75rem 1rem; color: var(--text); }
  #archiveList { overflow: auto; padding: .5rem; display: flex; flex-direction: column; gap: .4rem; }
  .conv { display: flex; align-items: center; gap: .4rem; padding: .5rem .6rem; border: 1px solid var(--line); border-radius: 8px; }
  .conv.current { border-color: var(--accent); }
  .conv div { flex: 1; min-width: 0; }
  .conv b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .conv small { color: var(--muted); }
  .conv button { padding: .3rem .6rem; font-size: .8rem; }
  #convTitle { cursor: pointer; }

  @media (max-width: 900px) {
    #app { grid-template-columns: 1fr; overflow: auto; }
    #app > section { min-height: 45vh; border-right: 0; border-bottom: 1px solid var(--line); }
    #chat { min-height: 70vh !important; order: -1; }
  }
</style>
</head>
<body>

<form id="login" class="center">
  <h1>Mills</h1>
  <p>Sign in to talk to Claude and build on your PC.</p>
  <input id="password" type="password" placeholder="Password" autocomplete="current-password" autofocus>
  <button type="submit" id="signin">Sign in</button>
  <div class="err" id="loginErr"></div>
  <div class="status" id="bridgeStatus">Looking for Mills…</div>
</form>

<div id="shell" hidden>
  <header>
    <b>Mills</b>
    <span class="folder" id="folderName">No folder open</span>
    <button id="pickFolder">Open folder on my PC</button>
    <button class="ghost" id="newChat" title="Start a fresh conversation">New chat</button>
    <button class="ghost" id="saveChat" title="Save this conversation to the Archive">Save to Archive</button>
    <button class="ghost" id="openArchive" title="Saved conversations">Archive</button>
    <button class="ghost" id="logout">Sign out</button>
  </header>
  <main id="app">
    <section id="files">
      <div class="bar"><button class="ghost" id="up" title="Up one folder">↑</button><span id="cwd">/</span>
        <button class="ghost" id="newFile" title="New file">+</button><button class="ghost" id="refresh" title="Refresh">⟳</button></div>
      <div id="tree"></div>
    </section>
    <section id="edit">
      <div class="bar"><span id="openName">No file open</span>
        <button id="save" disabled>Save</button><button class="ghost" id="del" disabled>Delete</button></div>
      <textarea id="editor" spellcheck="false" placeholder="Open a file from the left to edit it here."></textarea>
    </section>
    <section id="chat">
      <div class="bar"><span id="convTitle" title="Click to rename">Unsaved conversation</span></div>
      <div id="log"><div class="sys">Tell Claude what you need. Open a folder on your PC first so it can build and edit files there.</div></div>
      <form id="composer">
        <textarea id="input" placeholder="Tell Claude what to build…  (Enter to send, Shift+Enter for a new line)"></textarea>
        <button type="submit" id="send">Send</button><button type="button" class="ghost" id="stop" hidden>Stop</button>
      </form>
    </section>
  </main>
</div>

<div id="archive" hidden>
  <div class="box">
    <div class="bar"><span>Archive — saved conversations</span><button class="ghost" id="closeArchive">Close</button></div>
    <div id="archiveList"></div>
  </div>
</div>

<script>
const GH_USER = 'G-Fourteen';
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

// Stable per-browser device id — Mills locks itself to the first device that signs in.
let deviceId = store.get('mills.device');
if (!deviceId) { deviceId = crypto.randomUUID() + crypto.randomUUID(); store.set('mills.device', deviceId); }
let token = sessionStorage.getItem('mills.token');
let base = null;

// ---------- find the bridge (its tunnel address changes each time Gee starts it) ----------
async function findBridge() {
  if (location.hostname === 'localhost' || location.hostname.endsWith('trycloudflare.com')) return location.origin;
  const list = await fetch(`https://api.github.com/users/${GH_USER}/gists?per_page=100`).then((r) => r.json());
  const gist = Array.isArray(list) && list.find((g) => g.files && g.files['mills-bridge.json']);
  if (!gist) throw new Error('Mills is not running yet.');
  const full = await fetch(gist.url).then((r) => r.json());
  const url = JSON.parse(full.files['mills-bridge.json'].content).url;
  if (!url) throw new Error('Mills is not running yet.');
  return url;
}
async function connect() {
  const s = $('bridgeStatus');
  try {
    base = await findBridge();
    const ok = await fetch(base + '/api/status').then((r) => r.ok).catch(() => false);
    if (!ok) throw new Error('Mills is offline — ask Gee to start it.');
    s.textContent = 'Mills is online'; s.className = 'status on';
    return true;
  } catch (e) {
    base = null;
    s.textContent = e.message + ' Retrying…'; s.className = 'status';
    setTimeout(connect, 15000);
    return false;
  }
}

async function api(path, opts = {}) {
  if (!base) throw new Error('Mills is offline — ask Gee to start it.');
  const res = await fetch(base + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}), ...(opts.headers || {}) },
  });
  if (res.status === 401 && path !== '/api/login') { signOut(); throw new Error('Session expired — sign in again.'); }
  return res;
}
async function json(path, opts) {
  const res = await api(path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

// ---------- login ----------
$('login').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('loginErr').textContent = '';
  if (!base && !(await connect())) { $('loginErr').textContent = 'Mills is offline — ask Gee to start it.'; return; }
  try {
    const data = await json('/api/login', { method: 'POST', body: JSON.stringify({ password: $('password').value, deviceId }) });
    token = data.token; sessionStorage.setItem('mills.token', token);
    $('password').value = '';
    enter();
  } catch (err) { $('loginErr').textContent = err.message; }
});
function enter() {
  $('login').hidden = true; $('shell').hidden = false;
  restoreFolder();
}
function signOut() {
  token = null; sessionStorage.removeItem('mills.token');
  $('shell').hidden = true; $('login').hidden = false;
}
$('logout').onclick = async () => { try { await api('/api/logout', { method: 'POST' }); } catch {} signOut(); };

// ---------- folder on Alfreddo's PC (File System Access API) ----------
let rootHandle = null;
const idb = {
  open() { return new Promise((ok, no) => { const r = indexedDB.open('mills', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); }); },
  async get(k) { const db = await this.open(); return new Promise((ok) => { const r = db.transaction('kv').objectStore('kv').get(k); r.onsuccess = () => ok(r.result); r.onerror = () => ok(null); }); },
  async set(k, v) { const db = await this.open(); return new Promise((ok) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = ok; t.onerror = ok; }); },
};

$('pickFolder').onclick = async () => {
  if (!window.showDirectoryPicker) { sys('This browser cannot open folders. Use Chrome or Edge on a computer.', true); return; }
  try {
    if (rootHandle && $('pickFolder').textContent.startsWith('Reopen') && (await rootHandle.requestPermission({ mode: 'readwrite' })) === 'granted') return setFolder(rootHandle);
    const h = await window.showDirectoryPicker({ mode: 'readwrite' });
    await idb.set('root', h).catch(() => {});
    setFolder(h);
  } catch (e) { if (e.name !== 'AbortError') sys(e.message, true); }
};
async function restoreFolder() {
  try {
    const h = await idb.get('root');
    if (!h) return;
    rootHandle = h;
    if ((await h.queryPermission({ mode: 'readwrite' })) === 'granted') setFolder(h);
    else { $('folderName').textContent = 'Click "Reopen ' + h.name + '" to allow access again'; $('pickFolder').textContent = 'Reopen ' + h.name; }
  } catch {}
}
function setFolder(h) {
  rootHandle = h;
  $('folderName').textContent = '📁 ' + h.name;
  $('pickFolder').textContent = 'Change folder';
  listDir('');
}

function parts(p) {
  const segs = String(p || '').replace(/\\/g, '/').split('/').filter((s) => s && s !== '.');
  if (segs.includes('..')) throw new Error('Paths cannot go above the opened folder.');
  return segs;
}
async function dirAt(segs, create = false) {
  if (!rootHandle || $('pickFolder').textContent.startsWith('Reopen')) throw new Error('No folder is open on Alfreddo\'s PC yet. Ask him to click "Open folder on my PC".');
  let d = rootHandle;
  for (const s of segs) d = await d.getDirectoryHandle(s, { create });
  return d;
}
const fsOps = {
  async list({ path = '' }) {
    const d = await dirAt(parts(path)); const out = [];
    for await (const [name, h] of d.entries()) out.push(h.kind === 'directory' ? name + '/' : name);
    return out.sort().join('\n') || '(empty folder)';
  },
  async read({ path }) {
    const segs = parts(path); const d = await dirAt(segs.slice(0, -1));
    return (await (await d.getFileHandle(segs.at(-1))).getFile()).text();
  },
  async write({ path, content = '' }) {
    const segs = parts(path); if (!segs.length) throw new Error('Missing file name.');
    const d = await dirAt(segs.slice(0, -1), true);
    const w = await (await d.getFileHandle(segs.at(-1), { create: true })).createWritable();
    await w.write(content); await w.close();
    return 'Wrote ' + segs.join('/') + ' (' + content.length + ' chars)';
  },
  async delete({ path }) {
    const segs = parts(path); if (!segs.length) throw new Error('Refusing to delete the whole folder.');
    const d = await dirAt(segs.slice(0, -1));
    await d.removeEntry(segs.at(-1), { recursive: true });
    return 'Deleted ' + segs.join('/');
  },
  async mkdir({ path }) { await dirAt(parts(path), true); return 'Created folder ' + parts(path).join('/'); },
};

// ---------- file panel ----------
let cwd = '', openPath = null;
const join = (a, b) => (a ? a + '/' : '') + b;
async function listDir(dir) {
  if (!rootHandle) return;
  try {
    const d = await dirAt(parts(dir)); const entries = [];
    for await (const [name, h] of d.entries()) entries.push({ name, dir: h.kind === 'directory' });
    entries.sort((a, b) => (b.dir - a.dir) || a.name.localeCompare(b.name));
    cwd = dir; $('cwd').textContent = '/' + dir;
    const tree = $('tree'); tree.textContent = '';
    if (!entries.length) tree.innerHTML = '<div style="color:var(--muted);cursor:default">(empty)</div>';
    for (const e of entries) {
      const row = document.createElement('div');
      row.textContent = (e.dir ? '📁 ' : '📄 ') + e.name;
      row.onclick = () => e.dir ? listDir(join(dir, e.name)) : openFile(join(dir, e.name));
      tree.appendChild(row);
    }
  } catch (err) { sys(err.message, true); }
}
async function openFile(p) {
  try {
    $('editor').value = await fsOps.read({ path: p });
    openPath = p; $('openName').textContent = p; $('save').disabled = $('del').disabled = false;
  } catch (err) { sys(err.message, true); }
}
$('save').onclick = async () => {
  try { await fsOps.write({ path: openPath, content: $('editor').value });
    $('openName').textContent = openPath + '  ✓ saved'; setTimeout(() => $('openName').textContent = openPath, 1500);
  } catch (err) { sys(err.message, true); }
};
$('del').onclick = async () => {
  const b = $('del');
  if (b.dataset.armed !== '1') { b.dataset.armed = '1'; b.textContent = 'Confirm delete'; setTimeout(() => { b.dataset.armed = ''; b.textContent = 'Delete'; }, 3000); return; }
  try { await fsOps.delete({ path: openPath });
    openPath = null; $('editor').value = ''; $('openName').textContent = 'No file open'; $('save').disabled = b.disabled = true;
    b.dataset.armed = ''; b.textContent = 'Delete'; listDir(cwd);
  } catch (err) { sys(err.message, true); }
};
$('editor').addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); if (openPath) $('save').click(); }
});
$('newFile').onclick = async () => {
  const name = window.prompt('New file name:');
  if (!name) return;
  const p = join(cwd, name);
  try { await fsOps.write({ path: p, content: '' }); listDir(cwd); openFile(p); } catch (err) { sys(err.message, true); }
};
$('up').onclick = () => listDir(cwd.split('/').slice(0, -1).join('/'));
$('refresh').onclick = () => listDir(cwd);

// ---------- chat ----------
const log = $('log');
const scroll = () => { log.scrollTop = log.scrollHeight; };
function sys(text, bad) { const d = document.createElement('div'); d.className = 'sys' + (bad ? ' bad' : ''); d.textContent = text; log.appendChild(d); scroll(); }
function line(cls, text) { const d = document.createElement('div'); d.className = cls; d.textContent = text; log.appendChild(d); return d; }
function bubble(cls) { const d = document.createElement('div'); d.className = 'msg ' + cls; log.appendChild(d); return d; }
function renderText(el, text) {
  el.textContent = '';
  text.split(/```[^\n]*\n?/).forEach((part, i) => {
    if (i % 2) { const pre = document.createElement('pre'); pre.textContent = part.replace(/\n$/, ''); el.appendChild(pre); }
    else if (part) el.appendChild(document.createTextNode(part));
  });
}
function describeTool(t) {
  const i = t.input || {};
  const name = t.name.replace(/^mcp__pc__/, 'your PC › ');
  const target = i.path ?? i.file_path ?? i.command ?? i.pattern ?? i.url ?? i.query ?? '';
  return '⚙ ' + name + (target !== '' ? '  ' + String(target).slice(0, 160) : '');
}

async function runPcTool(ev) {
  let body;
  if (!fsOps[ev.name]) body = { id: ev.id, ok: false, error: 'Unknown tool ' + ev.name };
  else {
    try { body = { id: ev.id, ok: true, result: await fsOps[ev.name](ev.args || {}) }; }
    catch (e) { body = { id: ev.id, ok: false, error: e.message }; }
  }
  api('/api/pc-result', { method: 'POST', body: JSON.stringify(body) }).catch(() => {});
  if (ev.name !== 'read' && ev.name !== 'list') listDir(cwd);
}

let busy = false, fresh = false;
function setBusy(b) { busy = b; $('send').hidden = b; $('stop').hidden = !b; $('input').disabled = b; }

$('composer').addEventListener('submit', async (e) => {
  e.preventDefault();
  const message = $('input').value.trim();
  if (!message || busy) return;
  $('input').value = '';
  renderText(bubble('me'), message); record('me', message); scroll();
  setBusy(true);
  try {
    const res = await api('/api/chat', { method: 'POST', body: JSON.stringify({ message, fresh }) });
    fresh = false;
    if (!res.ok) { const d = await res.json().catch(() => ({})); throw new Error(d.error || res.statusText); }
    const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n')) >= 0) {
        const l = buf.slice(0, i); buf = buf.slice(i + 1);
        if (l.trim()) { try { handleEvent(JSON.parse(l)); } catch {} }
      }
    }
  } catch (err) { sys(err.message, true); }
  setBusy(false); $('input').focus();
  if (archiveId) saveToArchive(true); // keep the archived copy up to date
});

function handleEvent(ev) {
  if (ev.type === 'pc_tool') return runPcTool(ev);
  if (ev.type === 'assistant' && ev.message) {
    for (const block of ev.message.content || []) {
      if (block.type === 'text' && block.text.trim()) { renderText(bubble('claude'), block.text); record('claude', block.text); }
      else if (block.type === 'tool_use') { const t = describeTool(block); line('tool', t); record('tool', t); }
    }
  } else if (ev.type === 'result') {
    if (ev.is_error) sys('Claude stopped with an error: ' + (ev.result || ev.subtype), true);
    else sys('Done' + (ev.duration_ms ? ' in ' + Math.round(ev.duration_ms / 1000) + 's' : ''));
  } else if (ev.type === 'bridge_error') sys(ev.text, true);
  else if (ev.type === 'bridge_done' && ev.code) sys('Claude stopped (code ' + ev.code + ')', true);
  scroll();
}

$('input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('composer').requestSubmit(); }
});
$('stop').onclick = () => api('/api/stop', { method: 'POST' }).catch(() => {});
$('newChat').onclick = () => {
  if (busy) return sys('Stop Claude before starting a new chat.', true);
  fresh = true; log.innerHTML = ''; setConversation(null, null, []);
  sys('New conversation — Claude starts fresh on your next message.');
};

// ---------- archive (saved conversations, stored on Gee's PC in Mills/Archive) ----------
let transcript = [], archiveId = null, archiveTitle = null;
function record(cls, text) { transcript.push({ cls, text }); }
function setConversation(id, title, items) {
  archiveId = id; archiveTitle = title; transcript = items;
  $('convTitle').textContent = title ? '🗂 ' + title : 'Unsaved conversation';
}
async function saveToArchive(quiet) {
  if (!transcript.length) return quiet || sys('Nothing to save yet — send a message first.', true);
  let title = archiveTitle;
  if (!archiveId) {
    const first = (transcript.find((t) => t.cls === 'me') || {}).text || '';
    title = window.prompt('Name this conversation:', first.replace(/\s+/g, ' ').slice(0, 60));
    if (title === null) return;
  }
  try {
    const d = await json('/api/archive/save', { method: 'POST', body: JSON.stringify({ id: archiveId, title, transcript }) });
    setConversation(d.id, d.title, transcript);
    if (!quiet) sys('Saved to Archive as "' + d.title + '".');
  } catch (err) { sys('Could not save: ' + err.message, true); }
}
async function renameConversation(id, current) {
  const title = window.prompt('Rename conversation:', current);
  if (!title || title === current) return;
  try {
    const d = await json('/api/archive/rename', { method: 'POST', body: JSON.stringify({ id, title }) });
    if (id === archiveId) setConversation(id, d.title, transcript);
    if (!$('archive').hidden) showArchive();
  } catch (err) { sys(err.message, true); }
}
async function showArchive() {
  $('archive').hidden = false;
  const listEl = $('archiveList'); listEl.textContent = 'Loading…';
  try {
    const { items } = await json('/api/archive/list', { method: 'POST' });
    listEl.textContent = '';
    if (!items.length) listEl.innerHTML = '<div class="sys">No saved conversations yet. Use "Save to Archive" on a chat.</div>';
    for (const it of items) {
      const row = document.createElement('div'); row.className = 'conv' + (it.id === archiveId ? ' current' : '');
      const info = document.createElement('div');
      const b = document.createElement('b'); b.textContent = it.title;
      const s = document.createElement('small'); s.textContent = new Date(it.savedAt).toLocaleString() + ' · ' + it.count + ' entries';
      info.append(b, s);
      const open = document.createElement('button'); open.textContent = 'Open';
      open.onclick = () => openConversation(it.id);
      const ren = document.createElement('button'); ren.className = 'ghost'; ren.textContent = 'Rename';
      ren.onclick = () => renameConversation(it.id, it.title);
      const del = document.createElement('button'); del.className = 'ghost'; del.textContent = 'Delete';
      del.onclick = async () => {
        if (del.dataset.armed !== '1') { del.dataset.armed = '1'; del.textContent = 'Confirm'; setTimeout(() => { del.dataset.armed = ''; del.textContent = 'Delete'; }, 3000); return; }
        try {
          await json('/api/archive/delete', { method: 'POST', body: JSON.stringify({ id: it.id }) });
          if (it.id === archiveId) setConversation(null, null, transcript); // chat stays on screen, just unsaved
          showArchive();
        } catch (err) { sys(err.message, true); }
      };
      row.append(info, open, ren, del); listEl.appendChild(row);
    }
  } catch (err) { listEl.textContent = ''; sys(err.message, true); $('archive').hidden = true; }
}
async function openConversation(id) {
  if (busy) return sys('Stop Claude before opening another conversation.', true);
  try {
    const entry = await json('/api/archive/open', { method: 'POST', body: JSON.stringify({ id }) });
    log.innerHTML = ''; fresh = false;
    for (const t of entry.transcript) {
      if (t.cls === 'tool') line('tool', t.text); else renderText(bubble(t.cls), t.text);
    }
    setConversation(entry.id, entry.title, entry.transcript);
    sys('Continuing "' + entry.title + '" — Claude remembers this conversation.');
    $('archive').hidden = true; scroll();
  } catch (err) { sys(err.message, true); }
}
$('saveChat').onclick = () => saveToArchive(false);
$('openArchive').onclick = showArchive;
$('closeArchive').onclick = () => { $('archive').hidden = true; };
$('archive').onclick = (e) => { if (e.target.id === 'archive') $('archive').hidden = true; };
$('convTitle').onclick = () => { if (archiveId) renameConversation(archiveId, archiveTitle); else saveToArchive(false); };

connect().then((ok) => { if (ok && token) json('/api/check').then(enter).catch(() => signOut()); });
</script>
</body>
</html>
