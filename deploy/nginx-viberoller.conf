# VibeRoller on the lab server: nginx in front of the hub (which listens on 127.0.0.1 only).
# Install as root: cp deploy/nginx-viberoller.conf /etc/nginx/sites-available/viberoller.conf
#                  ln -s ../sites-available/viberoller.conf /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
# This named server block wins over the *.git.unityailab.com wildcard for this one host name.
# Set the certificate lines to the wildcard certificate the lab's nginx already uses.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name viberoller.git.unityailab.com;

    ssl_certificate     /etc/ssl/unityailab/fullchain.pem;   # ← the lab wildcard certificate
    ssl_certificate_key /etc/ssl/unityailab/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # pictures, voice clips, encrypted attachments (the hub has its own, smaller limits per route)
    client_max_body_size 25m;

    # the hub's internal routes are for its own helpers on the same machine only
    location ^~ /internal/ { return 404; }

    location / {
        proxy_pass http://127.0.0.1:7777;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # the client's address only; never trust a client-sent chain
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP "";             # no client may pretend to come through a tunnel
        # WebSocket-ready (future live connection), and streaming answers (Work, API, long polls) unbuffered
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name viberoller.git.unityailab.com;
    return 301 https://$host$request_uri;
}

# for the Connection header above (define once per nginx; skip if the lab config already has it)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
