# VibeRoller's plain name, viberoller.git.unityailab.com: the SAME rules as the portal (deploy/nginx-portal.conf), so there
# is no second, public door: insiders (the server's own addresses: an SSH SOCKS tunnel, a VPN ending here) get the hub,
# everyone else the droids 404, and /node/ stays open for the AI hosts (their own id + secret). It uses the geo map and the
# Connection map the portal file defines, so install both files together.
# A copy waits on the server at /srv/apps/VibeRoller/deploy-ready/viberoller.git.unityailab.com. Install (root, once):
#   cp /srv/apps/VibeRoller/deploy-ready/viberoller.git.unityailab.com /etc/nginx/sites-available/
#   ln -s ../sites-available/viberoller.git.unityailab.com /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name viberoller.git.unityailab.com;

    ssl_certificate     /etc/letsencrypt/live/unityailab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/unityailab.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    # pictures, voice clips, encrypted attachments (the hub has its own, smaller limits per route)
    client_max_body_size 25m;

    error_page 404 /droids.html;
    location = /droids.html {
        internal;
        default_type text/html;
        return 404 '<!doctype html><html lang="en"><head><meta charset="utf-8"><title>404 Not Found</title><meta name="robots" content="noindex"><style>html,body{height:100%;margin:0;background:#0b0b0f;color:#cfcfd6;font:16px/1.5 system-ui,Segoe UI,Roboto,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center}h1{font-size:1.4rem;font-weight:600;margin:0 0 .4rem}p{margin:0;opacity:.7}</style></head><body><div><h1>These are not the droids you are looking for.</h1><p>404 Not Found</p></div></body></html>';
    }

    # the hub's internal routes are for its own helpers on the same machine only
    location ^~ /internal/ { return 404; }

    # AI hosts connect from their homes: open, answers only to a host's own id + secret
    location ^~ /node/ {
        proxy_pass http://127.0.0.1:7777;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        if ($vr_inside = 0) { return 404; }
        proxy_pass http://127.0.0.1:7777;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # the client's address only; never trust a client-sent chain
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP "";             # no client may pretend to come through a tunnel
        # WebSocket-ready (future live connection), and streaming answers (Work, API, long polls) unbuffered
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $vr_portal_connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name viberoller.git.unityailab.com;
    return 301 https://$host$request_uri;
}
