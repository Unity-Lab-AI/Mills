# VibeRoller's dev hub: dev.portal.unityailab.com (team note plans/dev-hub.md). The same front door as the live one
# (deploy/nginx-portal.conf) in front of the dev hub, which listens on 127.0.0.1:7778 only and runs Forgejo's develop.
# A copy waits on the server at /srv/apps/VibeRoller/deploy-ready/dev.portal.unityailab.com. Install (root, once, after
# the DNS record points here):
#   certbot certonly --nginx -d dev.portal.unityailab.com
#   cp /srv/apps/VibeRoller/deploy-ready/dev.portal.unityailab.com /etc/nginx/sites-available/
#   ln -s ../sites-available/dev.portal.unityailab.com /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# Its own zone and map names: nginx refuses a name defined twice, and the live site defines its own.

map $http_upgrade $vr_dev_connection_upgrade {
    default upgrade;
    ""      close;
}

limit_req_zone  $binary_remote_addr zone=vr_dev_login:10m rate=10r/m;
limit_req_zone  $binary_remote_addr zone=vr_dev_all:10m   rate=30r/s;
limit_conn_zone $binary_remote_addr zone=vr_dev_conn:10m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dev.portal.unityailab.com;

    ssl_certificate     /etc/letsencrypt/live/dev.portal.unityailab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.portal.unityailab.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    server_tokens off;

    client_max_body_size 25m;

    location ^~ /internal/ { return 404; }

    limit_req_status  429;
    limit_conn_status 429;
    limit_conn vr_dev_conn 60;

    location = /api/login {
        limit_req zone=vr_dev_login burst=10 nodelay;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:7778;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP "";
    }

    location / {
        limit_req zone=vr_dev_all burst=200 nodelay;
        proxy_pass http://127.0.0.1:7778;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $vr_dev_connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name dev.portal.unityailab.com;
    # certbot's HTTP check comes in here before the certificate exists
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
