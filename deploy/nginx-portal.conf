# VibeRoller's private front door: portal.unityailab.com (and portal.git.unityailab.com, which the lab's wildcard
# certificate already covers while portal.unityailab.com gets its DNS record and its certificate).
#
# Who sees what:
#   - connections that come FROM the server itself (an SSH tunnel used as a SOCKS proxy: ssh -D 1080 ovh, then the
#     browser's proxy set to socks5://127.0.0.1:1080; a VPN that ends on the server; anything on 127.0.0.1) get the
#     VibeRoller page with its sign-in screen and can sign in;
#   - everyone else gets a plain 404 page: "These are not the droids you are looking for." Nothing hints at what runs here.
# A copy waits on the server at /srv/apps/VibeRoller/deploy-ready/portal.unityailab.com. Install (root, once):
#   cp /srv/apps/VibeRoller/deploy-ready/portal.unityailab.com /etc/nginx/sites-available/
#   ln -s ../sites-available/portal.unityailab.com /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# Then, for the short name: a DNS A record portal.unityailab.com -> 135.148.100.111 (AAAA 2604:2dc0:100:386f::) and
#   certbot --nginx -d portal.unityailab.com   (or expand the unityailab.com certificate with that name)
# and in the hub's bridge/config.local.json set "publicUrl": "https://portal.unityailab.com" (graceful restart).

# ── who counts as "inside": the machine itself and its own addresses (a SOCKS tunnel exits with these) ──
geo $vr_inside {
    default        0;
    127.0.0.0/8    1;
    ::1            1;
    135.148.100.111 1;
    2604:2dc0:100:386f::/64 1;
    # add a VPN range here if one ends on this server, e.g.  100.64.0.0/10 1;  (Tailscale)  or  10.8.0.0/24 1;  (WireGuard)
}

# for the Connection header below (defined once per nginx; drop this block if another site defines it)
map $http_upgrade $vr_portal_connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name portal.unityailab.com portal.git.unityailab.com;

    ssl_certificate     /etc/letsencrypt/live/unityailab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/unityailab.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    # pictures, voice clips, encrypted attachments (the hub has its own, smaller limits per route)
    client_max_body_size 25m;

    # outsiders: the droids page, as a real 404, for every path
    error_page 404 /droids.html;
    location = /droids.html {
        internal;
        default_type text/html;
        return 404 '<!doctype html><html lang="en"><head><meta charset="utf-8"><title>404 Not Found</title><meta name="robots" content="noindex"><style>html,body{height:100%;margin:0;background:#0b0b0f;color:#cfcfd6;font:16px/1.5 system-ui,Segoe UI,Roboto,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center}h1{font-size:1.4rem;font-weight:600;margin:0 0 .4rem}p{margin:0;opacity:.7}</style></head><body><div><h1>These are not the droids you are looking for.</h1><p>404 Not Found</p></div></body></html>';
    }

    # the hub's internal routes are for its own helpers on the same machine only
    location ^~ /internal/ { return 404; }

    # AI hosts (Gee's PC lending its Claude and Unity's engines) connect from their homes, so /node/ is open to everyone:
    # it answers only to a host's own id + secret (bridge/ai-nodes.js), everything else there is 401
    location ^~ /node/ {
        proxy_pass http://127.0.0.1:7777;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        if ($vr_inside = 0) { return 404; }
        proxy_pass http://127.0.0.1:7777;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # the client's address only; never trust a client-sent chain
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP "";             # no client may pretend to come through a tunnel
        # WebSocket-ready (future live connection), and streaming answers (Work, API, long polls) unbuffered
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $vr_portal_connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name portal.unityailab.com portal.git.unityailab.com;
    return 301 https://$host$request_uri;
}
