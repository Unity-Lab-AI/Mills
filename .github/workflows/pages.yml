name: Deploy Mills to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # The GitHub account whose gist advertises the hub address is a repository variable,
      # not part of the source: Settings → Secrets and variables → Actions → Variables.
      - name: Inject hub gist owner
        env:
          OWNER: ${{ vars.MILLS_GIST_OWNER }}
        run: |
          test -n "$OWNER" || { echo "Set the MILLS_GIST_OWNER repository variable."; exit 1; }
          sed -i "s/__MILLS_GIST_OWNER__/$OWNER/" web/index.html
      # Optional: a named Cloudflare tunnel's address (https://<hostname>), so the page's security policy
      # and its hub-address check accept it besides *.trycloudflare.com. Empty = quick tunnels only.
      - name: Inject hub host (named tunnel, optional)
        env:
          HUBHOST: ${{ vars.MILLS_HUB_HOST }}
        run: |
          case "$HUBHOST" in ""|https://*) ;; *) echo "MILLS_HUB_HOST must be empty or start with https://"; exit 1;; esac
          sed -i "s#__MILLS_HUB_HOST__#$HUBHOST#g" web/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
